<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* Navigation */
        nav {
            background: #111827;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #60a5fa;
        }

        /* Hero */
        .hero {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: white;
            color: #2563eb;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #e5e7eb;
        }

        /* About */
        .about {
            max-width: 800px;
            margin: auto;
            padding: 70px 20px;
            text-align: center;
        }

        .about h2 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        .about p {
            font-size: 18px;
            line-height: 1.7;
        }

        /* Contact */
        .contact {
            background: white;
            text-align: center;
            padding: 70px 20px;
        }

        .contact h2 {
            font-size: 35px;
            margin-bottom: 20px;
        }

        .contact p {
            margin-bottom: 25px;
        }

        /* Footer */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .hero h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <div>
            <h1>Welcome 👋</h1>
            <p>A simple, modern website made with HTML and CSS.</p>
            <a href="#about" class="button">Learn More</a>
        </div>
    </section>

    <section class="about" id="about">
        <h2>About Me</h2>
        <p>
            Hello! This is my simple website. I can use this space
            to introduce myself, my business, my project, or my work.
        </p>
    </section>

    <section class="contact" id="contact">
        <h2>Contact Me</h2>
        <p>I'd love to hear from you.</p>
        <a href="mailto:hello@example.com" class="button">
            Send Email
        </a>
    </section>

    <footer>
        <p>© 2026 MyWebsite</p>
    </footer>

</body>
</html>
